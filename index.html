          <input id="bufSlider" type="range" min="0" max="8" step="1" value="0" class="w-16 cursor-pointer" oninput="onPaceChange()" />
          <span id="bufLabel" class="font-mono font-bold w-10 text-right tabular-nums">+0分</span>
        </div>

        <button id="mapThemeBtn" onclick="toggleMapTheme()" class="pill-idle px-2.5 py-1.5 rounded-lg font-medium cursor-pointer">

        </button>
      </div>
    </div>

              <span class="flex items-center gap-1"><span class="inline-block w-3 h-1 rounded" style="background:#db2777;"></span>13-18棒</span>

              <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded-full" style="background:#ef4444;"></span>禁停/警戒</span>
            </div>
            <span id="elevSummary" class="font-mono font-semibold"></span>
          </div>
          <div class="w-full" style="height: 56px;">
            <svg id="elevSvg" viewBox="0 0 600 60" preserveAspectRatio="none" class="ui-subcard w-full h-full rounded" style="display:block;"></svg>
          </div>
        </div>
      </div>
    </section>

    <!-- RIGHT: 6-Person Action Matrix & Tabs (5 cols on lg) -->
    <section class="lg:col-span-5 flex flex-col gap-3">
      <div class="ui-card rounded-xl flex flex-col overflow-hidden h-full">

        <div class="px-3 pt-2 border-b ui-border flex items-center justify-between gap-2">
          <div class="flex items-center gap-1 text-xs overflow-x-auto">
            <button onclick="setTab('now')" id="tabNow" class="tab-btn px-3 py-2 font-bold border-b-2 transition whitespace-nowrap cursor-pointer">此刻分工</button>
            <button onclick="setTab('table')" id="tabTable" class="tab-btn px-3 py-2 font-bold border-b-2 transition whitespace-nowrap cursor-pointer">18棒總表</button>

        <div id="tabBody" class="p-3 overflow-y-auto thin-scroll flex-1" style="max-height: 580px;"></div>
      </div>
    </section>

// Sandbox-safe storage helpers (opaque-origin iframes throw SecurityError on localStorage)
function safeLoadLions() {
  try {
    const s = window.localStorage && window.localStorage.getItem("crufu_2026_kinmen_lions");
    return new Set(s ? JSON.parse(s) : []);
  } catch (e) {
    return new Set();
  }
}
function safeSaveLions(setObj) {
  try {
    if (window.localStorage) {
      window.localStorage.setItem("crufu_2026_kinmen_lions", JSON.stringify([...setObj]));
    }
  } catch (e) {}
}

function mapPalette() {
  return state.mapDark
    ? { sea: "#0c2138", grid: "url(#seaGridDark)", land: "#1e293b", coast: "#64748b", label: "#cbd5e1", halo: "#0f172a" }
    : { sea: "#dbeafe", grid: "url(#seaGridLight)", land: "#fffdf7", coast: "#64748b", label: "#334155", halo: "#ffffff" };
}

// Mercator projection to 1200x750 SVG
const MIN_LON = 118.205, MAX_LON = 118.485, MIN_LAT = 24.382, MAX_LAT = 24.540;
function mercY(lat) { return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)); }
const D_LON_RAD = (MAX_LON - MIN_LON) * Math.PI / 180;
const PX_PER_RAD = 1120 / D_LON_RAD;
const MERC_TOP = mercY(MAX_LAT);
const PAD_X = 40, PAD_Y = 27;

function proj(lat, lon) {
  const x = PAD_X + ((lon - MIN_LON) * Math.PI / 180) * PX_PER_RAD;
  const y = PAD_Y + (MERC_TOP - mercY(lat)) * PX_PER_RAD;
  return [x, y];
}

function fmtClock(totalMins) {
  const day = totalMins < 1440 ? "11/21" : "11/22";
  const m = Math.round(totalMins) % 1440;
  const hh = String(Math.floor(m / 60)).padStart(2, "0");
  const mm = String(m % 60).padStart(2, "0");
  return `${day} ${hh}:${mm}`;
}

function computeTimetable() {
  let cur = 16 * 60; // 16:00 Day 1
  const tt = [];
  for (const l of RACE_DATA.legs) {
    const runMin = (l.dist * state.paceSec) / 60;
    const startMin = cur;
    const endMin = startMin + runMin;
    let waitNote = null;
    if (l.leg === 9) {
      const r9Open = 27 * 60; // 11/22 03:00
      const r9Close = 29 * 60; // 11/22 05:00
      if (endMin < r9Open) {
        const w = Math.round(r9Open - endMin);
        waitNote = `提前抵達強制休息點，休息 ${Math.floor(w/60)}小時${w%60}分 至 03:00 開門再出發`;
        cur = r9Open;
      } else if (endMin <= r9Close) {
        waitNote = `於 03:00–05:00 開關門窗口內抵達`;
        cur = Math.min(r9Close, endMin + state.bufMin);
      } else {
        waitNote = `⚠️ 晚於 05:00 關門時間，建議提高配速`;
        cur = endMin + state.bufMin;
      }
    } else {
      cur = endMin + state.bufMin;
    }
    tt.push({
      leg: l.leg,
      startMin,
      endMin,
      runMin: Math.round(runMin),
      timeStr: `${fmtClock(startMin)}–${fmtClock(endMin).slice(6)}`,
      waitNote
    });
  }
  state.timetable = tt;
}

    const pts = l.pts.map(p => proj(p[0], p[1]).map(v => v.toFixed(1)).join(",")).join(" ");

    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${(isAct ? 2.2 : 2.5) * invScale}" stroke-opacity="${isAct ? 0.2 : 0.52}" stroke-linecap="round" stroke-linejoin="round" class="cursor-pointer" onclick="selectLeg(${l.leg})" />`;

    </g>`;
  }).join("");

  // 8. Relay Nodes (0..18)
  const relG = document.getElementById("layerRelays");
  const sortedNodes = [...RACE_DATA.nodes].sort((a, b) => {
    const aAct = (a.id === state.leg - 1 || a.id === state.leg) ? 1 : 0;
    const bAct = (b.id === state.leg - 1 || b.id === state.leg) ? 1 : 0;
    return aAct - bAct;
  });
  relG.innerHTML = sortedNodes.map(n => {
    let [x, y] = proj(n.coord[0], n.coord[1]);
    if (n.id === 16 && state.zoom.k < 2.2 && state.leg < 15) { x += 12 * invScale; y += 10 * invScale; }
    const isStartNode = n.id === state.leg - 1;
    const isEndNode = n.id === state.leg;
    let bg = "#dc2626";
    let lbl = String(n.id);
    if (n.type === "start") { bg = "#16a34a"; lbl = "起"; }
    else if (n.type === "finish") { bg = "#0f172a"; lbl = "終"; }
    else if (n.type === "rest") { bg = "#7e22ce"; lbl = "9休"; }
    const rad = (isStartNode || isEndNode) ? 11.5 : 8.5;
    const strokeCol = isEndNode ? "#f59e0b" : (isStartNode ? "#22c55e" : "#ffffff");
    return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${invScale})" class="cursor-pointer" onclick="inspectNode(${n.id})">
      ${isEndNode ? `<circle r="16" fill="none" stroke="#f59e0b" stroke-width="2.2" class="pulse-circle" />` : ""}
      <circle r="${rad}" fill="${bg}" stroke="${strokeCol}" stroke-width="${isEndNode || isStartNode ? 2.6 : 1.5}" />
      <text y="3.5" text-anchor="middle" font-size="${lbl.length > 1 ? 8 : 9.5}" font-weight="800" fill="#ffffff">${lbl}</text>
    </g>`;
  }).join("");
}

// Animation along active leg & car route
let animT = 0;
function samplePolyline(pts, t) {
  if (!pts || pts.length === 0) return [0, 0];
  if (pts.length === 1) return proj(pts[0][0], pts[0][1]);
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = proj(pts[i][0], pts[i][1]), b = proj(pts[i+1][0], pts[i+1][1]);
    const d = Math.hypot(b[0]-a[0], b[1]-a[1]);
    segs.push({ a, b, d });
    total += d;
  }
  let target = t * total;
  for (const s of segs) {
    if (target <= s.d || s === segs[segs.length - 1]) {
      const f = s.d > 0 ? target / s.d : 0;
      return [s.a[0] + (s.b[0]-s.a[0])*f, s.a[1] + (s.b[1]-s.a[1])*f];
    }
    target -= s.d;
  }
  return proj(pts[0][0], pts[0][1]);
}

function tickAnim() {
  animT = (animT + 0.0045) % 1;
  const pal = mapPalette();
  const legObj = RACE_DATA.legs[state.leg - 1];
  const invScale = 1 / Math.pow(state.zoom.k, 0.62);
  const [rx, ry] = samplePolyline(legObj.pts, animT);
  const [cx, cy] = samplePolyline(legObj.car_pts, Math.min(1, animT * 1.35));
  const animG = document.getElementById("layerAnim");
  let html = "";
  if (state.layers.route) {
    html += `<g transform="translate(${rx.toFixed(1)},${ry.toFixed(1)}) scale(${invScale})">
      <circle r="7" fill="${ROUND_COLORS[legObj.round]}" stroke="#ffffff" stroke-width="2" />
      <text y="-11" text-anchor="middle" font-size="10.5" font-weight="800" fill="${pal.label}" stroke="${pal.halo}" stroke-width="3.2" paint-order="stroke">🏃 ${legObj.runner}</text>
    </g>`;
  }
  if (state.layers.car) {
    html += `<g transform="translate(${cx.toFixed(1)},${cy.toFixed(1)}) scale(${invScale})">
      <rect x="-8" y="-6" width="16" height="12" rx="3" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
      <text y="3.5" text-anchor="middle" font-size="8.5" font-weight="800" fill="#111827">車</text>
      <text y="-10" text-anchor="middle" font-size="10" font-weight="800" fill="#b45309" stroke="${pal.halo}" stroke-width="3.2" paint-order="stroke">🚗 ${legObj.driver}</text>
    </g>`;
  }
  animG.innerHTML = html;
  requestAnimationFrame(tickAnim);
}

// Pan & Zoom
function applyTransform() {
  document.getElementById("viewport").setAttribute("transform", `translate(${state.zoom.tx.toFixed(2)}, ${state.zoom.ty.toFixed(2)}) scale(${state.zoom.k.toFixed(3)})`);
  renderMapLayers();
  updateScaleBar();
}

function updateScaleBar() {
  const pxPerKm = 39.48 * state.zoom.k;
  let km = 2;
  if (state.zoom.k >= 3.2) km = 0.5;
  else if (state.zoom.k >= 1.7) km = 1;
  const barPx = Math.round(pxPerKm * km * ((document.getElementById("kinmenMap").clientWidth || 840) / 1200));
  document.getElementById("scaleBarLine").style.width = Math.max(28, Math.min(120, barPx)) + "px";
  document.getElementById("scaleBarLabel").textContent = km < 1 ? `${km * 1000} m` : `${km} km`;
}

function zoomBy(factor, cx = 600, cy = 375) {
  const newK = Math.max(0.85, Math.min(8, state.zoom.k * factor));
  const ratio = newK / state.zoom.k;
  state.zoom.tx = cx - (cx - state.zoom.tx) * ratio;
  state.zoom.ty = cy - (cy - state.zoom.ty) * ratio;
  state.zoom.k = newK;
  applyTransform();
}

function focusBox(lat0, lon0, lat1, lon1) {
  const [x0, y1] = proj(lat0, lon0);
  const [x1, y0] = proj(lat1, lon1);
  const bw = Math.max(40, x1 - x0), bh = Math.max(40, y1 - y0);
  const k = Math.max(1, Math.min(5.5, Math.min(960 / bw, 580 / bh)));
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  state.zoom.k = k;
  state.zoom.tx = 600 - mx * k;
  state.zoom.ty = 375 - my * k;
  applyTransform();
}

function zoomPreset(p) {
  if (p === "all") { state.zoom = { k: 1, tx: 0, ty: 0 }; applyTransform(); }
  else if (p === "east") focusBox(24.420, 118.375, 24.535, 118.475);
  else if (p === "west") focusBox(24.385, 118.285, 24.490, 118.385);
  else if (p === "lieyu") focusBox(24.402, 118.210, 24.458, 118.272);
}

function zoomToLeg(legNum) {
  const l = RACE_DATA.legs[legNum - 1];
  const all = l.pts.concat(l.car_pts);
  const lats = all.map(p => p[0]), lons = all.map(p => p[1]);
  const pad = 0.006;
  focusBox(Math.min(...lats)-pad, Math.min(...lons)-pad, Math.max(...lats)+pad, Math.max(...lons)+pad);
}

function toggleMapTheme() {
  state.mapDark = !state.mapDark;
  document.getElementById("mapThemeBtn").textContent = state.mapDark ? "☀️ 淺色地圖" : "🌙 深色地圖";

// Mouse / Touch pan & wheel
const svgEl = document.getElementById("kinmenMap");
let dragging = false, dragLast = null;
svgEl.addEventListener("pointerdown", e => {
  if (e.target.closest("[onclick]")) return;
  dragging = true;
  dragLast = [e.clientX, e.clientY];
  try { svgEl.setPointerCapture(e.pointerId); } catch (err) {}
});
svgEl.addEventListener("pointermove", e => {
  if (!dragging) return;
  const rect = svgEl.getBoundingClientRect();
  const dx = (e.clientX - dragLast[0]) * (1200 / (rect.width || 1200));
  const dy = (e.clientY - dragLast[1]) * (750 / (rect.height || 750));
  dragLast = [e.clientX, e.clientY];
  state.zoom.tx += dx;
  state.zoom.ty += dy;
  applyTransform();
});
svgEl.addEventListener("pointerup", () => { dragging = false; });
svgEl.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = svgEl.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (1200 / (rect.width || 1200));
  const cy = (e.clientY - rect.top) * (750 / (rect.height || 750));
  zoomBy(e.deltaY < 0 ? 1.18 : 0.85, cx, cy);
}, { passive: false });

// Clipboard & external-browser navigation helper
const IS_STANDALONE_WEB = (() => {
  try {
    return window.top === window.self || Boolean(window.location && /^https?:|^file:/.test(window.location.protocol));
  } catch (e) {
    return false;
  }
})();
function gmapsUrl(lat, lon) {
  return `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
}
function navActionHtml(lat, lon, label = "導航", compact = false) {
  const url = gmapsUrl(lat, lon);
  const cls = compact ? "pill-idle px-2 py-0.5 rounded shrink-0 cursor-pointer" : "pill-active px-2.5 py-1.5 rounded-md text-xs font-semibold shrink-0 cursor-pointer";
  if (IS_STANDALONE_WEB) {
    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="${cls}" style="text-decoration:none;">🗺️ 開啟${label}</a>`;
  }
  return `<button onclick="copyText('${url}', this)" class="${cls}">📋 複製${label}</button>`;
}
function copyText(text, btnEl) {
  const done = () => {
    if (!btnEl) return;
    const orig = btnEl.textContent;
    btnEl.textContent = "✓ 已複製！";
    setTimeout(() => { btnEl.textContent = orig; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    cb();
  } catch (e) {}
}

function showInspector(title, subtitle, bodyHtml, lat, lon, extraBtnHtml = "") {

function renderElevProfile() {

  const minE = Math.min(...elev, 0), maxE = Math.max(...elev, 30);
  const span = Math.max(20, maxE - minE);
  const pts = elev.map((e, i) => {
    const x = (i / (elev.length - 1)) * 580 + 10;
    const y = 50 - ((e - minE) / span) * 38;
    return [x, y];

  const line = pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ");
  const area = `10,55 ${line} 590,55`;
  const col = ROUND_COLORS[l.round];
  svg.innerHTML = `

    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.2" />
    <text x="12" y="14" font-size="11" font-weight="600" fill="#64748b">最高 ${l.peak[2]}m</text>

}

        tip: legLions.length ? `可趁等待空檔順路拍：${legLions.map(x => x.name.split(" ")[0]).join("、")}` : "協助檢查上一棒與下一棒補給水壺、替駕駛提神。"
      };
    });

    const destUrl = gmapsUrl(endNode.coord[0], endNode.coord[1]);
    box.innerHTML = `
      <div class="space-y-3">
        <div class="ui-subcard rounded-lg p-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <div class="text-sm font-bold">第 ${l.leg} 棒｜${startNode.area} → ${endNode.area}</div>
              <div class="text-xs ui-muted mt-0.5">預估時段：<strong class="font-mono">${t.timeStr}</strong>（約 ${t.runMin} 分）｜難度：<strong>${l.diff}</strong>｜距離：${l.dist}K</div>
            </div>
            ${navActionHtml(endNode.coord[0], endNode.coord[1], `第${l.leg}區導航`, false)}
          </div>
          <div class="flex flex-wrap gap-1.5 mt-2">
            ${l.tags.map(tg => `<span class="ui-card px-2 py-0.5 rounded-full text-xs">${tg}</span>`).join("")}
          </div>
          ${t.waitNote ? `<div class="mt-2 px-2.5 py-1.5 rounded text-xs font-semibold" style="background:#fef3c7;color:#92400e;border:1px solid #fcd34d;">🛑 ${t.waitNote}</div>` : ""}
        </div>

        <div class="grid grid-cols-1 gap-2">
          ${roles.map(r => `
            <div class="ui-subcard rounded-lg p-2.5" style="border-left: 4px solid ${r.border};">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${MEMBER_COLORS[r.name]}"></span>
                  <span class="font-bold text-sm">${r.name}</span>
                </div>
                <span class="px-2 py-0.5 rounded text-xs font-semibold text-white" style="background:${r.badgeBg}">${r.badge}</span>
              </div>
              <div class="mt-1.5 text-xs leading-relaxed">${r.action}</div>
              <div class="mt-1 text-xs ui-muted">📍 <strong>位置：</strong>${r.where}</div>
              <div class="mt-0.5 text-xs ui-muted">💡 ${r.tip}</div>
            </div>
          `).join("")}
        </div>

        <div class="ui-subcard rounded-lg p-2.5 text-xs space-y-1.5">
          <div class="font-bold">🦁 本棒沿線風獅爺與設施速查（${legLions.length}處）</div>
          ${legLions.length ? legLions.map(w => `
            <div class="flex items-center justify-between gap-2 py-1 border-t ui-border">
              <div>
                <span class="font-semibold">#${w.id} ${w.name}</span>
                <span class="ui-muted"> — ${w.note}</span>
              </div>
              ${navActionHtml(w.lat, w.lon, "導航", true)}
            </div>
          `).join("") : `<div class="ui-muted">本棒次無官方表列風獅爺（專心趕路 / 補眠）</div>`}
          <div class="pt-1 border-t ui-border ui-muted">
            <strong>終點站廁所：</strong>${endNode.wc}
          </div>
        </div>
      </div>
    `;
  } else if (state.tab === "table") {
    box.innerHTML = `
      <div class="text-xs">
        <div class="mb-2 ui-muted">點擊任一列可即時將左側地圖與分工切換至該棒次：</div>
        <table class="w-full border-collapse text-left">
          <thead>
            <tr class="border-b ui-border ui-muted">
              <th class="py-1.5 px-1">棒</th>
              <th class="py-1.5 px-1">預估時段</th>
              <th class="py-1.5 px-1">跑者</th>
              <th class="py-1.5 px-1">駕駛</th>
              <th class="py-1.5 px-1">下棒等</th>
              <th class="py-1.5 px-1 text-right">距離</th>
            </tr>
          </thead>
          <tbody>
            ${RACE_DATA.legs.map((lg, i) => {
              const tt = state.timetable[i];
              const act = lg.leg === state.leg;
              const isDarkByClock = ((tt.endMin % 1440) >= 17*60 + 20) || ((tt.startMin % 1440) < 6*60 + 15);
              return `<tr onclick="selectLeg(${lg.leg}); setTab('now');" class="border-b ui-border cursor-pointer transition" style="${act ? 'background:rgba(37,99,235,0.14);' : ''}">
                <td class="py-2 px-1 font-bold">${lg.leg}${isDarkByClock ? "🌙" : "☀️"}</td>
                <td class="py-2 px-1 font-mono whitespace-nowrap">${tt.timeStr}</td>
                <td class="py-2 px-1 font-semibold" style="color:${MEMBER_COLORS[lg.runner]}">${lg.runner}</td>
                <td class="py-2 px-1 font-semibold whitespace-nowrap" style="color:${MEMBER_COLORS[lg.driver]}">${lg.driver}</td>
                <td class="py-2 px-1 ui-muted">${lg.next_runner || "🏁"}</td>
                <td class="py-2 px-1 text-right font-mono">${lg.dist}K</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  } else if (state.tab === "drivers") {
    const stats = MEMBERS.map(m => {
      const runLegs = RACE_DATA.legs.filter(l => l.runner === m);
      const drvLegs = RACE_DATA.legs.filter(l => l.driver === m);
      return {
        name: m,
        runList: runLegs.map(x => `第${x.leg}棒`).join("、"),
        runKm: runLegs.reduce((a, b) => a + b.dist, 0).toFixed(2),
        drvList: drvLegs.length ? drvLegs.map(x => `第${x.leg}棒`).join("、") : "免開車 (0棒)",
        drvCount: drvLegs.length
      };
    });
    box.innerHTML = `
      <div class="space-y-3 text-xs">
        <div class="ui-subcard rounded-lg p-3">
          <div class="font-bold text-sm mb-1">✅ 駕駛排班原則（Luka 9 &gt; 阿凱 4 &gt; Kiwi 3 &gt; Mick 2）</div>
          <ul class="space-y-1 ui-muted list-disc pl-4">
            <li><strong>Cindy、Lewis 完全免開車（0 棒）</strong></li>
            <li><strong>無「剛跑完就開車」</strong>：剛交棒者保證至少休 1 棒才碰方向盤</li>
            <li><strong>無「開完車馬上跑」</strong>：下一棒跑者全程免開車，專心熱身穿裝備</li>
          </ul>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          ${stats.map(s => `
            <div class="ui-subcard rounded-lg p-2.5">
              <div class="flex items-center justify-between">
                <span class="font-bold text-sm" style="color:${MEMBER_COLORS[s.name]}">${s.name}</span>
                <span class="ui-card px-2 py-0.5 rounded font-semibold">${s.drvCount} 棒駕駛</span>
              </div>
              <div class="mt-1.5">🏃 <strong>跑步 (${s.runKm}K)：</strong>${s.runList}</div>
              <div class="mt-0.5 ui-muted">🚗 <strong>駕駛：</strong>${s.drvList}</div>
            </div>
          `).join("")}
        </div>

        <div class="ui-subcard rounded-lg p-3 space-y-1.5">
          <div class="font-bold text-sm">🎒 最新大會行前重點檢核清單（全隊必讀）</div>
          <div>• <strong>🆕 第1、2棒新路線</strong>：太武山往倒影塔施工至12月底！<strong>第1棒(6.1K Cindy)</strong>至「毋忘在莒」原路折返下至東側新第1區（車禁上山，Cindy必自備飲水補給）；<strong>第2棒(8.9K 阿凱)</strong>由東側新第1區起跑！勿跑舊軌跡、勿跟錯 61K 專用牌！</div>
          <div>• <strong>⏰ 起點時程（林務所）</strong>：<strong>15:20–15:30</strong>抵達停車、領物資（大浴巾/補給/號碼布/車貼/拍拍尺晶片）→ <strong>15:40（出發前20分）準時至拱門旁唱名拍團拍</strong>（完賽證書照片）→ <strong>16:00 起跑</strong>！</div>
          <div>• <strong>⛽ 補給車油量與交管</strong>：金門加油站<strong>非全24H營業，集合前務必先加滿油</strong>！前擋右上/後擋左上貼車貼；交棒後儘速駛離接力區、打閃黃燈、勿擋民宅；金城避開「車站郵局前」與「西南門里站牌」科技執法；垃圾隨車集中至終點分類丟棄。</div>
          <div>• <strong>🧥 15°C低溫防風 &amp; 車上備品</strong>：沿海與金門大橋(13/16棒)側風極冷！個人備妥<strong>排汗衣＋保暖中層＋防風外套＋手套＋頭巾＋長褲＋乾襪（3套）</strong>；車上必備<strong>乾衣、大毛巾、保暖毯、防水袋</strong>（交棒上車先擦乾換濕衣再休息）。</div>
          <div>• <strong>🔦 夜跑重點檢錄 &amp; 安全</strong>：5分速下<strong>第3、4棒(17:20後)即天黑</strong>！必戴<strong>頭燈＋尾燈＋反光背心</strong>；開放道路遵守紅綠燈；<strong>全程禁戴耳機、全程禁酒</strong>；第9區博物館勿碰館內布置；風獅爺不攀爬觸碰。</div>
          <div>• <strong>🚑 失溫緊急處置</strong>：若持續發抖、步態不穩、口齒不清或反應異常 → <strong>立即停賽、移避風處保暖、隊友陪同、撥打 119 並打號碼布上大會救護電話</strong>！</div>
        </div>
      </div>
    `;
  } else if (state.tab === "lions") {
    const cnt = state.collected.size;
    const pct = Math.min(100, Math.round((cnt / 30) * 100));
    box.innerHTML = `
      <div class="space-y-3 text-xs">
        <div class="ui-subcard rounded-lg p-3">
          <div class="flex items-center justify-between font-bold text-sm">
            <span>🦁 風獅爺集點進度：${cnt} / 30 隻</span>
            <span style="color: ${cnt >= 30 ? '#16a34a' : (cnt >= 15 ? '#d97706' : '#64748b')};">
              ${cnt >= 30 ? "🏆 達標：飄帶吊飾 + 高粱酒！" : (cnt >= 15 ? "🎖️ 已達15隻：飄帶吊飾！" : "目標：15隻 / 30隻")}
            </span>
          </div>
          <div class="ui-card w-full h-2.5 rounded-full mt-2 overflow-hidden">
            <div class="h-full transition-all" style="width:${pct}%; background: #9333ea;"></div>
          </div>
          <div class="mt-2 ui-muted">
            ⚠️ <strong>2026 路線對照修正提醒：</strong>文件文字將「金門城x2」寫在15棒、「歐厝」寫在16棒，但依 2026 含小金門最新 GPX，<strong>金門城大/小獅與歐厝都在第 18 棒</strong>，而<strong>第 16 棒小金門回程經過的是「后頭風獅爺 x2」</strong>！
          </div>
        </div>

        <div class="space-y-1.5">
          ${RACE_DATA.wind_lions.map((w, idx) => {
            const done = state.collected.has(w.id);
            return `<div class="ui-subcard rounded-lg p-2 flex items-start justify-between gap-2">
              <label class="flex items-start gap-2 cursor-pointer flex-1">
                <input type="checkbox" ${done ? "checked" : ""} onchange="toggleLion('${w.id}')" class="mt-0.5 cursor-pointer" />
                <div>
                  <div class="font-semibold ${done ? 'line-through opacity-60' : ''}">#${w.id} ${w.name} <span class="ui-card px-1.5 py-0.5 rounded text-xs font-normal ml-1">${w.leg_img}</span></div>
                  <div class="ui-muted mt-0.5">${w.note}</div>
                </div>
              </label>
              <div class="flex flex-col gap-1 shrink-0 text-right">
                <button onclick="focusBox(${w.lat-0.008},${w.lon-0.012},${w.lat+0.008},${w.lon+0.012}); inspectLion(${idx});" class="pill-idle px-2 py-0.5 rounded cursor-pointer">地圖定位</button>
                ${navActionHtml(w.lat, w.lon, "導航", true)}
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
    `;
  }
}

function updateUI() {
  document.querySelectorAll(".layer-btn").forEach(btn => {
    const k = btn.getAttribute("data-layer");
    btn.className = "layer-btn px-2 py-1 rounded-md font-medium transition cursor-pointer " + (state.layers[k] ? "pill-active" : "pill-idle opacity-65");
  });

  const tabIds = { now: "tabNow", table: "tabTable", drivers: "tabDrivers", lions: "tabLions" };
  Object.entries(tabIds).forEach(([k, id]) => {
    const el = document.getElementById(id);
    if (k === state.tab) {
      el.style.borderColor = "var(--primary, #2563eb)";
      el.style.color = "var(--primary, #2563eb)";
    } else {
      el.style.borderColor = "transparent";
      el.style.color = "var(--muted-foreground, #64748b)";
    }
  });

  const sel = document.getElementById("legSelect");
  sel.innerHTML = RACE_DATA.legs.map((l, i) => `<option value="${l.leg}">第${l.leg}棒 · ${l.runner} (${state.timetable[i].timeStr})</option>`).join("");
  sel.value = String(state.leg);

  renderOverlayBanner();
  renderElevProfile();
  renderMapLayers();
  renderTabBody();
  updateLionBadge();
}

function setTab(t) { state.tab = t; updateUI(); }
function selectLeg(n) { state.leg = Math.max(1, Math.min(18, n)); updateUI(); }
function stepLeg(d) { selectLeg(state.leg + d > 18 ? 1 : (state.leg + d < 1 ? 18 : state.leg + d)); }
function toggleLayer(k) { state.layers[k] = !state.layers[k]; updateUI(); }
function onPaceChange() {
  state.paceSec = Number(document.getElementById("paceSlider").value);
  state.bufMin = Number(document.getElementById("bufSlider").value);
  const pm = Math.floor(state.paceSec / 60), ps = String(state.paceSec % 60).padStart(2, "0");
  document.getElementById("paceLabel").textContent = `${pm}:${ps}/km`;
  document.getElementById("bufLabel").textContent = `+${state.bufMin}分`;
  computeTimetable();
  updateUI();
}
function togglePlay() {
  state.playing = !state.playing;
  const btn = document.getElementById("playBtn");
  if (state.playing) {
    btn.textContent = "⏸ 暫停";
    state.playTimer = setInterval(() => stepLeg(1), 2800);
  } else {
    btn.textContent = "▶ 輪播";
    clearInterval(state.playTimer);
  }
}

// Init
computeTimetable();
renderSVGBase();
updateUI();
updateScaleBar();
requestAnimationFrame(tickAnim);
window.addEventListener("resize", updateScaleBar);
</script>
</body>
</html>
